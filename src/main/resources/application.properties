spring.application.name=pixel-arena
# Cấu hình cổng chạy server
server.port=8080

# Cấu hình kết nối cơ sở dữ liệu SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=PixelDB;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123

# Cấu hình JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# tự động cập nhật cấu trúc bằng nếu Entity thay đổi
spring.jpa.hibernate.ddl-auto=update